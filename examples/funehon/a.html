<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ふねの古本市 2026 — 鴨谷港（A：航路）</title>
<!--
  題材の特色：年に2回だけ、港に泊まったフェリーの船室と甲板が古本の売り場になる。
  考えの一文：このページでは、港から島への航路の線が、写真の窓と日付をつなぐ線になる。
  好みの台帳（taste.md）：いちばん好きの wedding.tonami-komuro.com の組み方（青1色の大きな斜体の英字・線・小さな写真）に寄せた。
  色：地 #eef2fb（朝の海の白さ）／主 #1d3fcf（フェリーの船体の青）／差し色 #ff5a1f（救命浮環の橙）
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2fb;--blue:#1d3fcf;--or:#ff5a1f}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--blue)}
body{font-family:"Zen Kaku Gothic New",sans-serif;font-size:16px;line-height:1.8;word-break:auto-phrase;overflow-x:hidden}
a{color:inherit}
.hero{position:relative;height:100svh;min-height:640px;overflow:hidden}
nav{position:absolute;top:24px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;z-index:5;font-size:15px;font-weight:700}
nav .logo{font-size:17px;letter-spacing:.04em}
nav ul{display:flex;gap:28px;list-style:none}
nav a{text-decoration:none}
.title{position:absolute;left:-1vw;top:20vh;font-family:"Instrument Serif",serif;font-style:italic;font-weight:400;line-height:.78;font-size:clamp(120px,21vw,330px);letter-spacing:-.02em;z-index:2;white-space:nowrap}
.title span{display:block}
.title span:nth-child(2){padding-left:24vw}
svg.route{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.port{position:absolute;border-radius:50%;overflow:hidden;z-index:4;border:6px solid var(--blue);background:var(--blue)}
.port img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(1.05)}
.port::after{content:"";position:absolute;inset:0;background:var(--blue);mix-blend-mode:screen;opacity:.55}
.p1{width:min(26vw,370px);aspect-ratio:1;right:9vw;top:13vh}
.p2{width:min(14vw,200px);aspect-ratio:1;left:30vw;bottom:9vh}
.p2 img{object-position:60% 50%}
.p3{width:min(10vw,140px);aspect-ratio:1;right:33vw;top:9vh}
.buoy{position:absolute;right:calc(9vw - 26px);top:calc(13vh + min(26vw,370px) - 70px);width:96px;height:96px;z-index:5}
.ticket{position:absolute;right:6vw;bottom:8vh;z-index:5;background:var(--bg);border:2px solid var(--blue);display:grid;grid-template-columns:auto auto;transform:rotate(-4deg)}
.ticket div{padding:14px 20px}
.ticket .d{border-right:2px dashed var(--blue);font-family:"Instrument Serif",serif;font-size:56px;line-height:.9}
.ticket .d small{display:block;font-family:"Zen Kaku Gothic New";font-size:14px;font-weight:700;margin-top:8px;letter-spacing:.06em}
.ticket .w{font-size:15px;line-height:1.6;font-weight:700}
.ticket .w a{display:inline-block;margin-top:10px;background:var(--or);color:#fff;text-decoration:none;padding:8px 18px;border-radius:999px;font-size:19px}
.tate{position:absolute;left:36px;bottom:9vh;writing-mode:vertical-rl;font-weight:700;font-size:20px;letter-spacing:.2em;z-index:5}
.tate small{font-size:14px;letter-spacing:.1em;font-weight:500;margin-top:16px}
.hand{position:absolute;color:#d63c00;right:calc(9vw + 130px);top:calc(13vh + min(26vw,370px) + 6px);font-family:"Instrument Serif",serif;font-style:italic;font-size:30px;color:var(--or);z-index:5;transform:rotate(-6deg)}
.credit{line-height:1.5;position:absolute;left:104px;bottom:20px;font-size:14px;z-index:5;text-align:left;background:var(--bg)}
@media (max-width:700px){
  .hero{height:auto;min-height:100svh;padding-bottom:420px}
  nav{left:16px;right:16px;top:16px}nav ul{display:none}
  .title{position:relative;left:-8px;top:auto;padding-top:96px;font-size:34vw;line-height:.8}
  .title span:nth-child(2){padding-left:14vw}
  .p1{width:58vw;right:-6vw;top:300px}.p3{display:none}.p2{width:30vw;left:6vw;bottom:auto;top:430px}
  .buoy{right:44vw;top:500px;width:64px;height:64px}.hand{display:none}
  .ticket{left:16px;right:16px;bottom:140px;transform:none}.ticket .w a{font-size:17px;white-space:nowrap}
  .ticket .d{font-size:44px}
  .tate{display:none}
  .credit{line-height:1.5;position:absolute;top:auto;bottom:16px;left:16px}
}
</style>
</head>
<body>
<section class="hero">
  <nav><span class="logo">ふねの古本市</span><ul><li><a href="#">出店する本屋</a></li><li><a href="#">船内の地図</a></li><li><a href="#">行き方</a></li></ul></nav>
  <h1 class="title" aria-label="Books Afloat ふねの古本市"><span>Books</span><span>Afloat</span></h1>
  <svg class="route" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
    <path d="M60 820 C 300 640, 380 900, 560 760 S 760 420, 980 420 S 1300 300, 1360 120" fill="none" stroke="#1d3fcf" stroke-width="2.5" stroke-dasharray="10 10" vector-effect="non-scaling-stroke"/>
    <ellipse cx="1020" cy="300" rx="380" ry="120" fill="none" stroke="#ff5a1f" stroke-width="2" transform="rotate(-14 1020 300)" vector-effect="non-scaling-stroke"/>
  </svg>
  <div class="port p1"><img src="photos/Plymouth-through-a-ferry-porthole-16783618309-.jpg" alt="フェリーの丸窓から見た港の町（プリマス）"></div>
  <div class="port p2"><img src="photos/Books-bookshelf-bookstore-159778.jpg" alt="棚に並んだ本の背"></div>
  <div class="port p3"><img src="photos/Wake-behind-a-ferry.jpg" alt="フェリーの航跡（瀬戸内海）"></div>
  <svg class="buoy" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="38" fill="none" stroke="#ff5a1f" stroke-width="22"/><g stroke="#eef2fb" stroke-width="22" fill="none" stroke-dasharray="14 45.7"><circle cx="50" cy="50" r="38" transform="rotate(-8 50 50)"/></g></svg>
  <p class="hand">2 days on board</p>
  <p class="tate">ふねの古本市<small>鴨谷港 第2岸壁</small></p>
  <div class="ticket">
    <div class="d">11.22<small>SAT–SUN 23</small></div>
    <div class="w">フェリー「かもや丸」の<br>船室と甲板に、24の古本屋。<br>10:00–16:00　入場無料<br><a href="#">出店する本屋を見る</a></div>
  </div>
  <p class="credit">写真（Wikimedia Commons）<br>丸窓：Jeremy Segrott（CC BY 2.0）<br>本の背：Pixabay（CC0）<br>航跡：メルビル（CC BY-SA 4.0）<br>架空の催しの作例です。</p>
</section>
</body>
</html>
