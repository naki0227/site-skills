<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ふねの古本市 2026 — 鴨谷港（C：もやい綱）</title>
<!--
  題材の特色：年に2回だけ、港に泊まったフェリーの船室と甲板が古本の売り場になる。
  考えの一文：このページでは、船を岸につなぐもやい綱が、本の写真と縦書きの名前に巻きつく色の線になる。
  好みの台帳（taste.md）：第4回いちばんの miraiz-persol.jp の組み方（写真を不定形に抜く・青の縦書きの大きな字・色の線を巻きつける）に寄せた。
  色：地 #fbfaf6（白）／主 #1d3fcf（船体の青）／差し色 #ff5a1f（救命浮環の橙）。線の3本目は主の青を薄めた #8fb0ff。
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfaf6;--blue:#1d3fcf;--or:#ff5a1f;--sky:#8fb0ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--blue)}
body{font-family:"Zen Kaku Gothic New",sans-serif;font-size:16px;line-height:1.8;word-break:auto-phrase;overflow-x:hidden}
a{color:inherit}
.hero{position:relative;height:100svh;min-height:680px;overflow:hidden;background-image:radial-gradient(#1d3fcf22 1.2px,transparent 1.4px);background-size:22px 22px}
nav{position:absolute;top:22px;left:32px;right:32px;display:flex;justify-content:space-between;z-index:6;font-size:15px;font-weight:700}
nav ul{display:flex;gap:28px;list-style:none}nav a{text-decoration:none}
.shape{position:absolute;left:14vw;top:9vh;width:56vw;height:80vh;z-index:2}
.shape svg{width:100%;height:100%}
.tate{position:absolute;right:5vw;top:6vh;writing-mode:vertical-rl;font-weight:900;font-size:clamp(84px,10.5vw,160px);line-height:1.02;letter-spacing:.02em;z-index:4}
.tate .s{color:var(--or)}
.sub{position:absolute;left:4vw;top:12vh;writing-mode:vertical-rl;font-weight:900;font-size:clamp(36px,4vw,60px);line-height:1.15;z-index:4}
svg.rope{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.info{position:absolute;left:4vw;bottom:6vh;z-index:5;background:var(--bg);border:2px solid var(--blue);border-radius:16px;padding:18px 22px;max-width:380px}
.info .date{font-weight:900;font-size:34px;line-height:1.2}
.info p{font-size:15px;font-weight:700;margin:6px 0 12px;line-height:1.7}
.info a{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;padding:9px 20px;border-radius:999px;font-weight:700}
.tag{position:absolute;left:calc(14vw + 40vw);top:calc(9vh + 58vh);z-index:5;background:#d63c00;color:#fff;font-weight:900;border-radius:50%;width:132px;height:132px;display:grid;place-items:center;text-align:center;line-height:1.25;font-size:17px;transform:rotate(-10deg)}
.tag b{font-size:40px;display:block;line-height:1}
.credit{line-height:1.5;position:absolute;right:5vw;bottom:12px;font-size:14px;z-index:5;text-align:right}
@media (max-width:700px){
  .hero{height:auto;min-height:100svh;padding:70px 0 20px}
  nav{left:16px;right:16px;top:16px}nav ul{display:none}
  .shape{position:relative;left:auto;top:auto;width:78%;height:46vh;margin-top:220px}
  .tate{font-size:15vw;right:3vw;top:60px;writing-mode:horizontal-tb;line-height:1.05}.tate br{display:none}
  .sub{font-size:7vw;right:4vw;left:auto;position:absolute;top:300px}
  .tag{left:auto;right:8vw;top:calc(220px + 36vh);width:96px;height:96px;font-size:13px}.tag b{font-size:28px}
  .info{position:relative;left:auto;bottom:auto;margin:16px;max-width:none}
  .credit{line-height:1.5;position:relative;right:auto;bottom:auto;text-align:left;margin:0 16px}
  svg.rope{display:none}
}
</style>
</head>
<body>
<section class="hero">
  <nav><span>鴨谷港 第2岸壁</span><ul><li><a href="#">出店する本屋</a></li><li><a href="#">船内の地図</a></li><li><a href="#">行き方</a></li></ul></nav>
  <div class="shape">
    <svg viewBox="0 0 800 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="棚に並んだ本の背と、フェリーの航跡の写真">
      <defs>
        <clipPath id="c1"><path d="M120 60 C 300 0, 520 30, 640 120 C 760 210, 700 330, 610 380 C 560 410, 470 400, 420 440 C 360 490, 300 560, 190 540 C 70 520, 20 400, 60 300 C 90 220, 40 110, 120 60Z"/></clipPath>
        <clipPath id="c2"><path d="M430 470 C 520 420, 700 430, 760 520 C 800 600, 720 700, 600 700 C 480 700, 380 650, 390 570 C 395 520, 400 490, 430 470Z"/></clipPath>
      </defs>
      <image href="photos/Books-bookshelf-bookstore-159778.jpg" x="-40" y="0" width="840" height="560" preserveAspectRatio="xMidYMid slice" clip-path="url(#c1)"/>
      <image href="photos/Wake-behind-a-ferry.jpg" x="370" y="420" width="420" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#c2)"/>
    </svg>
  </div>
  <svg class="rope" viewBox="0 0 1440 900" preserveAspectRatio="none" aria-hidden="true">
    <path d="M-20 300 C 200 200, 420 160, 560 260 S 820 520, 1080 380 S 1300 120, 1460 200" fill="none" stroke="#ff5a1f" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <path d="M-20 520 C 260 600, 380 420, 640 470 S 980 760, 1220 640 S 1400 520, 1460 560" fill="none" stroke="#8fb0ff" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
    <path d="M300 940 C 360 760, 520 820, 700 700 S 900 300, 1000 -20" fill="none" stroke="#1d3fcf" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
  </svg>
  <h1 class="tate">ふねの<br>古本<span class="s">市</span></h1>
  <p class="sub" aria-hidden="true">かもや丸</p>
  <div class="tag"><span><b>24</b>古本屋が<br>乗船</span></div>
  <div class="info">
    <div class="date">11.22 土 – 23 日</div>
    <p>フェリー「かもや丸」の船室と甲板で。<br>10:00–16:00　入場無料</p>
    <a href="#">出店する本屋を見る</a>
  </div>
  <p class="credit">写真（Wikimedia Commons）<br>本の背：Pixabay（CC0）<br>航跡：メルビル（CC BY-SA 4.0）<br>架空の催しの作例です。</p>
</section>
</body>
</html>
